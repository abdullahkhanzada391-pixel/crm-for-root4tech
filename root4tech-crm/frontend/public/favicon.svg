<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="r4t-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="45%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Vibrant Brand Accent Gradient -->
    <linearGradient id="r4t-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="r4t-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Shadow filter for depth -->
    <filter id="r4t-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0284C7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle with subtle border glow -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#r4t-bg)" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.45" />

  <!-- Geometric Tech Circuit Roots Background Lines -->
  <path d="M16 64 H28 M100 64 H112 M64 16 V26 M64 102 V112" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.35" />
  <circle cx="16" cy="64" r="3" fill="#38BDF8" fill-opacity="0.7" />
  <circle cx="112" cy="64" r="3" fill="#38BDF8" fill-opacity="0.7" />
  <circle cx="64" cy="16" r="3" fill="#38BDF8" fill-opacity="0.7" />
  <circle cx="64" cy="112" r="3" fill="#38BDF8" fill-opacity="0.7" />

  <!-- Main Monogram Emblem: Integrated R + 4 Design -->
  <g filter="url(#r4t-shadow)">
    <!-- 'R' Vertical Spine with root node branches -->
    <path d="M34 32 C34 29.5 35.8 28 38 28 H46 C48.2 28 50 29.5 50 32 V96 C50 98.5 48.2 100 46 100 H38 C35.8 100 34 98.5 34 96 Z" fill="#FFFFFF" />
    
    <!-- 'R' Root Circuit Anchor at Base -->
    <path d="M34 88 L24 96" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <circle cx="22" cy="98" r="2.5" fill="#38BDF8" />

    <!-- 'R' Upper Curved Loop -->
    <path d="M48 28 H66 C77.5 28 85 35 85 45 C85 55 77.5 62 66 62 H48 Z" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linejoin="round" />

    <!-- '4' Angled Diagonal Stroke into Horizontal Crossbeam -->
    <path d="M84 32 L52 72 H96" fill="none" stroke="url(#r4t-accent)" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- '4' Right Vertical Mast -->
    <path d="M80 50 V94 C80 96.5 78.5 98 76 98 H72 C69.5 98 68 96.5 68 94 V50 C68 47.5 69.5 46 72 46 H76 C78.5 46 80 47.5 80 50 Z" fill="url(#r4t-cyan)" />

    <!-- 'R' Dynamic Lower Leg -->
    <path d="M60 58 L84 96 C85.5 98 84 100 81 100 H72 C69.5 100 68 98.5 66.5 96 L48 68" fill="url(#r4t-accent)" />

    <!-- Intersecting Digital Pulse Node -->
    <circle cx="80" cy="72" r="6" fill="#38BDF8" />
    <circle cx="80" cy="72" r="3" fill="#FFFFFF" />
  </g>
</svg>
